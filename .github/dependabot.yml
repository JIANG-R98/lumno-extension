# Weekly update PRs for npm packages and the actions the workflows pin by
# commit SHA. Minor and patch updates come grouped, one PR per ecosystem;
# major updates come one PR each, since they may need code changes.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
