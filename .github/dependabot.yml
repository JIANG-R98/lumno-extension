# Weekly update PRs for npm packages and the actions the workflows pin by
# commit SHA. Minor and patch updates come grouped, one PR per ecosystem;
# major updates come one PR each, since they may need code changes.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    ignore:
      # The toolchain runs on Node 22 (engines in package.json), so its
      # types stay on 22.x.
      - dependency-name: "@types/node"
        versions: [">=23"]
    groups:
      # React ships in every page's bundle, so its updates can fail the
      # bundle budgets; they come on their own so the rest still lands.
      # A dependency joins the first group it matches.
      react:
        patterns: [react, react-dom, "@types/react", "@types/react-dom"]
        update-types: [minor, patch]
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
