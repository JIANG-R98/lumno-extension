# Weekly update PRs for npm packages and the actions the workflows pin by
# commit SHA. Minor and patch updates come grouped, one PR per ecosystem;
# major updates come one PR each, since they may need code changes.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    ignore:
      # The toolchain runs on Node 22 (engines in package.json), so its
      # types stay on 22.x.
      - dependency-name: "@types/node"
        versions: [">=23"]
      # React 19.3 adds about 8.5 KiB gzip to every page's bundle, the
      # injected overlay included, past the bundle budgets. 19.2 patches
      # still come; revisit with the next React minor.
      - dependency-name: react
        versions: [">=19.3.0 <19.4.0"]
      - dependency-name: react-dom
        versions: [">=19.3.0 <19.4.0"]
      - dependency-name: "@types/react"
        versions: [">=19.3.0 <19.4.0"]
      - dependency-name: "@types/react-dom"
        versions: [">=19.3.0 <19.4.0"]
      # jsdom 28+ changes CSS serialization, computed styles and listener
      # bookkeeping that 22 test files rely on; it moves as its own change.
      - dependency-name: jsdom
        update-types: ["version-update:semver-major"]
      # @vitejs/plugin-react 6 needs Vite 8, which in turn needs a newer
      # Vitest; the toolchain moves to Vite 8 as its own change.
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]
    groups:
      # React ships in every page's bundle, so its updates can fail the
      # bundle budgets; they come on their own so the rest still lands.
      # A dependency joins the first group it matches.
      react:
        patterns: [react, react-dom, "@types/react", "@types/react-dom"]
        update-types: [minor, patch]
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
