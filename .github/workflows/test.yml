name: Test

on:
  workflow_dispatch:
  push:
  pull_request:

concurrency:
  group: test-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm ci

      - name: Run tests and checks
        run: npm run verify

      - name: Verify generated React bundles are committed
        shell: bash
        run: |
          generated_changes="$(git status --short --untracked-files=all -- src/react)"
          if [[ -n "$generated_changes" ]]; then
            echo "::error title=React bundles are stale::Run npm run build:react and commit every generated change under src/react."
            echo "Generated React bundle changes:"
            echo "$generated_changes"
            git diff --stat -- src/react
            exit 1
          fi
