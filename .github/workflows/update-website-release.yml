# Asks lumno-web to rebuild the website when a release is published, edited
# or deleted; run it by hand to recover a missed update. A successful run only
# means the build was requested: check lumno-web's deploy-pages.yml run.
#
# Needs the LUMNO_WEB_ACTIONS_TOKEN Actions secret: a fine-grained token owned
# by kubai087 with access to only lumno-web and Actions: Read and write. The
# default GITHUB_TOKEN cannot dispatch another repository's workflow. Give the
# token an expiry and rotate it before then.

name: Update Website Release

on:
  release:
    types: [published, edited, deleted]
  workflow_dispatch:

permissions: {}

concurrency:
  group: update-website-release
  cancel-in-progress: false

jobs:
  dispatch:
    name: Trigger website build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Deploy website with current releases
        env:
          GH_TOKEN: ${{ secrets.LUMNO_WEB_ACTIONS_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::Add LUMNO_WEB_ACTIONS_TOKEN to this repository's Actions secrets. Use a fine-grained token scoped to kubai087/lumno-web with Actions: write permission."
            exit 1
          fi
          gh workflow run deploy-pages.yml --repo kubai087/lumno-web --ref main
