    <style data-nt-focus-paint-gate="true">
      html[data-nt-focus-route-pending="true"] {

      html[data-nt-focus-resume="true"][data-nt-focus-route-pending="true"] {
        visibility: visible;
      }
      html[data-nt-focus-route-pending="true"] body,
      body:not([data-nt-wallpaper-ready="1"]) {
        visibility: hidden;
        background-image: none !important;
      }
    </style>
